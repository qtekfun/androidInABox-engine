plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

android {

    namespace 'top.niunaijun.blackboxa'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"
    defaultConfig {
        applicationId "com.qtekfun.androidinabox"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode((System.getenv("AIAB_VERSION_CODE") ?: rootProject.ext.versionCode.toString()) as int)
        versionName(System.getenv("AIAB_VERSION_NAME") ?: rootProject.ext.versionName)

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        splits {
            abi {
                enable true
                reset()
                
                include 'armeabi-v7a', "arm64-v8a"
                universalApk true
            }
        }
    }

    signingConfigs {
        release {
            def ks = System.getenv("AIAB_KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("AIAB_KEYSTORE_PASSWORD")
                keyAlias System.getenv("AIAB_KEY_ALIAS")
                keyPassword System.getenv("AIAB_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig System.getenv("AIAB_KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        compose true
    }
    composeOptions {
        // Compatible con Kotlin 1.9.23
        kotlinCompilerExtensionVersion = "1.5.13"
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    packaging {
        jniLibs {
            excludes.add("**/libandroidx.graphics.path.so")
        }
        resources {
            excludes.add("**/libandroidx.graphics.path.so")
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "androidInABox_${variant.versionName}_${output.baseName}.apk"
        }
    }
}

